<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                template="/WEB-INF/templates/base.xhtml">
    <f:metadata>
        <f:viewParam name="nomeUsuario" value="#{visualizarPerfilBean.nomeUsuario}" />
        <f:viewAction action="#{visualizarPerfilBean.carregar}" />
    </f:metadata>
    <ui:define name="title">Perfil · HobbyHub</ui:define>
    <ui:param name="paginaAtiva" value="perfil" />
    <ui:define name="content">
        <main class="profile-page">
            <ui:include src="/WEB-INF/templates/mensagens.xhtml" />
            <h:panelGroup layout="block" styleClass="profile-layout"
                          rendered="#{not empty visualizarPerfilBean.perfil}">
                <aside class="profile-sidebar">
                    <div class="profile-avatar-wrap">
                        <ui:include src="/WEB-INF/templates/avatar.xhtml">
                            <ui:param name="classe" value="profile-avatar" />
                            <ui:param name="foto" value="#{visualizarPerfilBean.perfil.urlFotoPerfil}" />
                        </ui:include>
                        <span class="streak-badge" role="img"
                              aria-label="Sequência de #{visualizarPerfilBean.perfil.diasSeguidos} dias">
                            <span aria-hidden="true">🔥</span>
                            <strong><h:outputText value="#{visualizarPerfilBean.perfil.diasSeguidos}" /></strong>
                        </span>
                    </div>
                    <h1><h:outputText value="#{visualizarPerfilBean.perfil.nome}" /></h1>
                    <p class="profile-handle">@<h:outputText value="#{visualizarPerfilBean.perfil.nomeUsuario}" /></p>
                    <p class="profile-bio"><h:outputText value="#{visualizarPerfilBean.perfil.biografia}" /></p>
                    <h:link rendered="#{visualizarPerfilBean.perfil.meuPerfil}"
                            value="Editar perfil" outcome="/editar-perfil/editar-perfil.xhtml"
                            styleClass="button profile-edit" />
                </aside>
                <section class="profile-posts" aria-label="Posts do usuário">
                    <h2>Publicações</h2>
                    <ui:fragment rendered="#{empty visualizarPerfilBean.perfil.posts}">
                        <section class="empty"><h2>Nenhum post encontrado.</h2></section>
                    </ui:fragment>
                    <ui:repeat value="#{visualizarPerfilBean.perfil.posts}" var="post">
                        <article class="post-card">
                            <div class="post-header">
                                <ui:include src="/WEB-INF/templates/avatar.xhtml">
                                    <ui:param name="classe" value="" />
                                    <ui:param name="foto" value="#{post.urlFotoPerfil}" />
                                </ui:include>
                                <strong class="post-author"><h:outputText value="#{post.autor}" /></strong>
                                <div class="tags">
                                    <ui:repeat value="#{post.tags}" var="tag" varStatus="tagStatus">
                                        <span class="#{tagStatus.index eq 0 ? 'tag-general' : 'tag-specific'}">
                                            <h:outputText value="#{tag}" />
                                        </span>
                                    </ui:repeat>
                                </div>
                            </div>
                            <ui:fragment rendered="#{not empty post.urlImagem and not post.video}">
                                <img class="post-image" src="#{request.contextPath}#{post.urlImagem}"
                                     alt="Imagem compartilhada pelo autor" loading="lazy" />
                            </ui:fragment>
                            <ui:fragment rendered="#{not empty post.urlImagem and post.video}">
                                <video class="post-image" src="#{request.contextPath}#{post.urlImagem}"
                                       controls="controls" preload="metadata">
                                    Seu navegador não conseguiu reproduzir o vídeo.
                                </video>
                            </ui:fragment>
                            <p class="content"><h:outputText value="#{post.conteudo}" /></p>
                            <time class="post-date"><h:outputText value="#{post.dataFormatada}" /></time>
                        </article>
                    </ui:repeat>
                </section>
            </h:panelGroup>
        </main>
    </ui:define>
</ui:composition>
