<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/base.xhtml">
    <f:metadata>
        <f:viewAction action="#{postarBean.carregarFormulario}" />
    </f:metadata>
    <ui:define name="title">Novo post · HobbyHub</ui:define>
    <ui:define name="header">
        <ui:include src="/WEB-INF/templates/navbar.xhtml">
            <ui:param name="paginaAtiva" value="postar" />
        </ui:include>
    </ui:define>
    <ui:define name="content">
        <main class="compose compose-page">
            <p class="eyebrow">SEU PRÓXIMO HOBBY MOMENT</p>
            <h1>O que quer compartilhar hoje?</h1>
            <p>Conte sua atividade e escolha as tags que combinam com ela.</p>
            <ui:include src="/WEB-INF/templates/mensagens.xhtml" />
            <ui:include src="/WEB-INF/postar/formulario-post.xhtml" />
        </main>
    </ui:define>
</ui:composition>
