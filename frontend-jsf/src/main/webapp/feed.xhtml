<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" lang="pt-BR">
<f:metadata>
    <f:viewAction action="#{postBean.carregar}" />
</f:metadata>
<h:head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feed · HobbyHub</title>
    <h:outputStylesheet library="css" name="hobbyhub.css" />
</h:head>
<h:body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Navegação principal">
            <a class="brand" href="#{request.contextPath}/feed.xhtml" aria-label="HobbyHub, início">
                <h:graphicImage library="images" name="hobbyhub-logo.png" styleClass="brand-logo" alt="HobbyHub" />
            </a>
            <div class="nav-search" aria-label="Pesquisa de tags"><span>Pesquisar tags</span><span class="search-icon" aria-hidden="true"></span></div>
            <div class="nav-actions">
                <h:link value="Home" outcome="/feed.xhtml" styleClass="nav-link active" />
                <h:link value="Postar" outcome="/postar.xhtml" styleClass="nav-link" />
                <h:form id="sessao"><h:commandButton value="Sair" action="#{loginBean.sair}" styleClass="nav-logout" /></h:form>
            </div>
        </nav>
    </header>
    <main class="feed-main">
        <div class="feed-heading">
            <div><p class="eyebrow">HOBBYHUB · COMUNIDADE</p><h1>O que a galera está fazendo</h1></div>
            <h:link value="Atualizar feed" outcome="/feed.xhtml" styleClass="refresh-link" />
        </div>
        <h:messages id="mensagens" styleClass="messages" errorClass="error" infoClass="success" />
                        <h:form id="editar" rendered="#{not empty postBean.postEmEdicaoId}" styleClass="card post-edit">
                            <h2>Editar seu post</h2>
                            <h:outputLabel for="texto" value="Editar texto" />
                            <h:inputTextarea id="texto" value="#{postBean.edicao.conteudo}" rows="5" required="true"
                                             requiredMessage="Escreva o conteúdo do post." pt:maxlength="2000">
                                <f:validateBean />
                            </h:inputTextarea>
                            <small>A edição mantém as tags, a mídia e a data original.</small>
                            <div class="form-actions">
                                <h:commandButton value="Cancelar edição" action="#{postBean.cancelarEdicao}" immediate="true" styleClass="secondary" />
                                <h:commandButton value="Salvar texto" action="#{postBean.salvarEdicao}" />
                            </div>
                        </h:form>
        <details id="novo-post" class="feed-compose"
                 open="#{postBean.editorAberto or facesContext.validationFailed ? 'open' : null}">
            <summary aria-label="Criar post"><span class="compose-plus" aria-hidden="true">+</span><span>Compartilhar um hobby</span></summary>
            <h2>O que você está curtindo?</h2>
            <ui:include src="/WEB-INF/fragmentos/formulario-post.xhtml" />
        </details>
        <ui:fragment rendered="#{empty postBean.posts}">
            <section class="empty"><h2>O primeiro post pode ser seu.</h2><p>Use o botão + para compartilhar um hobby.</p></section>
        </ui:fragment>
        <section aria-label="Postagens">
            <ui:repeat value="#{postBean.posts}" var="post">
                <article class="post-card">
                    <div class="post-header">
                        <span class="avatar" aria-hidden="true"><span></span></span>
                        <strong class="post-author"><h:outputText value="#{post.autor}" /></strong>
                        <div class="tags"><ui:repeat value="#{post.tags}" var="tag"><span><h:outputText value="#{tag}" /></span></ui:repeat></div>
                    </div>
                    <ui:fragment rendered="#{not empty post.urlImagem and not post.video}">
                        <img class="post-image" src="#{request.contextPath}#{post.urlImagem}" alt="Imagem compartilhada pelo autor" loading="lazy" />
                    </ui:fragment>
                    <ui:fragment rendered="#{not empty post.urlImagem and post.video}">
                        <video class="post-image" src="#{request.contextPath}#{post.urlImagem}" controls="controls" preload="metadata">
                            Seu navegador não conseguiu reproduzir o vídeo.
                        </video>
                    </ui:fragment>
                    <p class="content"><h:outputText value="#{post.conteudo}" /></p>
                    <ui:fragment rendered="#{post.proprio}">
                        <h:form id="acoes" rendered="#{postBean.postEmEdicaoId ne post.id}" styleClass="post-actions">
                            <h:commandButton value="Editar texto" action="#{postBean.iniciarEdicao(post)}" styleClass="secondary" />
                            <h:commandButton value="Apagar post" action="#{postBean.excluir(post)}" styleClass="danger"
                                             onclick="return confirm('Apagar este post e sua mídia? Esta ação não pode ser desfeita.');" />
                        </h:form>

                    </ui:fragment>
                    <time class="post-date"><h:outputText value="#{post.dataFormatada}" /></time>
                </article>
            </ui:repeat>
        </section>
    </main>
    <h:link outcome="/postar.xhtml" styleClass="floating-post" pt:aria-label="Criar post"><span aria-hidden="true">+</span></h:link>
</h:body>
</html>
