<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" lang="pt-BR">
<h:head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · HobbyHub</title>
    <h:outputStylesheet library="css" name="hobbyhub.css" />
</h:head>
<h:body>
    <header class="site-header"><nav class="site-nav" aria-label="Navegação principal"><a class="brand" href="#{request.contextPath}/" aria-label="HobbyHub, início"><h:graphicImage library="images" name="hobbyhub-logo.png" styleClass="brand-logo" alt="HobbyHub" /></a></nav></header>
    <main class="login">
        <p class="eyebrow">SUAS PAIXÕES CONECTAM</p>
        <h1>Bem-vindo de volta.</h1>
        <p>Entre para compartilhar seus hobbies.</p>
        <h:messages id="mensagens" styleClass="messages" errorClass="error" infoClass="success" />
        <h:form id="login" styleClass="card">
            <h:outputLabel for="email" value="E-mail" />
            <h:inputText id="email" value="#{loginBean.email}" required="true"
                         requiredMessage="Informe seu e-mail." pt:type="email" pt:autocomplete="username" />
            <h:outputLabel for="senha" value="Senha" />
            <h:inputSecret id="senha" value="#{loginBean.senha}" required="true"
                           requiredMessage="Informe sua senha." pt:autocomplete="current-password" />
            <h:commandButton id="entrar" value="Entrar" action="#{loginBean.entrar}" />
        </h:form>
        <div class="demo">
            <p>Conta de demonstração: <strong>demo@hobbyhub.local</strong></p>
            <p>Senha: <strong>HobbyHub123!</strong></p>
        </div>
    </main>
</h:body>
</html>
