<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/base.xhtml">
    <ui:define name="title">Entrar · HobbyHub</ui:define>
    <ui:define name="header">
        <header class="site-header">
            <nav class="site-nav" aria-label="Navegação principal">
                <ui:include src="/WEB-INF/templates/marca.xhtml">
                    <ui:param name="destino" value="/" />
                </ui:include>
            </nav>
        </header>
    </ui:define>
    <ui:define name="content">
        <main class="login">
            <p class="eyebrow">SUAS PAIXÕES CONECTAM</p>
            <h1>Bem-vindo de volta.</h1>
            <p>Entre para compartilhar seus hobbies.</p>
            <ui:include src="/WEB-INF/templates/mensagens.xhtml" />
            <h:form id="login" styleClass="card">
                <h:outputLabel for="email" value="E-mail" />
                <h:inputText id="email" value="#{loginBean.email}" required="true"
                             requiredMessage="Informe seu e-mail." pt:type="email" pt:autocomplete="username" />
                <h:outputLabel for="senha" value="Senha" />
                <h:inputSecret id="senha" value="#{loginBean.senha}" required="true"
                               requiredMessage="Informe sua senha." pt:autocomplete="current-password" />
                <h:commandButton id="entrar" value="Entrar" action="#{loginBean.entrar}" />
            </h:form>
            <div class="demo">
                <p>Conta de demonstração: <strong>demo@hobbyhub.local</strong></p>
                <p>Senha: <strong>HobbyHub123!</strong></p>
            </div>
        </main>
    </ui:define>
</ui:composition>
