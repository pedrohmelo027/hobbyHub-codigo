<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <body>
        <header th:fragment="cabecalho">
            <nav>
                <a class="brand" th:href="@{/posts}">
                    hobby
                    <span>hub</span>
                </a>
                <div class="nav-actions">
                    <a th:href="@{/posts}">Feed</a>

</html>
