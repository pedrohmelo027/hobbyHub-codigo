<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Entrar · HobbyHub</title>
        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>
    <body>
        <main class="login">
            <a class="brand" th:href="@{/}">
                hobby
                <span>hub</span>
            </a>
            <p class="eyebrow">SEU PRÓXIMO HOBBY COMEÇA AQUI</p>
            <h1>Compartilhe o que você ama.</h1>
            <p>Entre para publicar e descobrir os hobbies da comunidade.</p>
            <p role="alert" class="error" th:if="${param.error}">Email ou senha inválidos.</p>
            <p role="status" class="success" th:if="${param.logout}">Você saiu da sua conta.</p>
            <form th:action="@{/login}" method="post">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="username" required />
                <label for="senha">Senha</label>
                <input
                    id="senha"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                />
                <button type="submit">Entrar</button>
            </form>
            <aside class="demo">
                <strong>Conta de demonstração</strong>
                <p>
                    demo@hobbyhub.local
                    <br />
                    Senha: HobbyHub123!
                </p>
            </aside>
        </main>
    </body>
</html>
