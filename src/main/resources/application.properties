spring.application.name=HobbyHub

spring.datasource.url=${MYSQL_URL:jdbc:mariadb://localhost:3306/hobbyhub?connectionTimeZone=America/Sao_Paulo}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=never
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
hobbyhub.midias.diretorio=./data/midias
hobbyhub.midias.max-bytes=26214400
